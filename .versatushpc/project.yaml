schema: 1
project: opencattus
type: cpp-application
default_branch: master

languages: [cpp]

publish:
  enabled: true
  product: opencattus
  channel: testing
  promotion:
    request_on_tag: true
    # CPack debug packages are disabled in cmake/CPackProperties.cmake, so
    # there is no testing-debug content to promote.
    promote_debug: false
    run_release_smoke: true
    enforce_tag_match: true
  smoke:
    enabled: true
    packages:
      el8:
        - opencattus
      el9:
        - opencattus
      el10:
        - opencattus
      ubuntu2404:
        - opencattus

preflight:
  image: quay.io/almalinuxorg/almalinux:10

container_builds:
  - name: EL8
    image: quay.io/almalinuxorg/almalinux:8
    arch: x86_64
    script: ./ci/build.sh
    args: [el8, x86_64]
    artifacts: "out/rpm/el8/x86_64/*.rpm"
    env:
      OPENCATTUS_EPEL_MIRROR: "http://mirror.local.versatushpc.com.br/epel"
  - name: EL9
    image: quay.io/almalinuxorg/almalinux:9
    arch: x86_64
    script: ./ci/build.sh
    args: [el9, x86_64]
    artifacts: "out/rpm/el9/x86_64/*.rpm"
    env:
      OPENCATTUS_EPEL_MIRROR: "http://mirror.local.versatushpc.com.br/epel"
  - name: EL10
    image: quay.io/almalinuxorg/almalinux:10
    arch: x86_64
    script: ./ci/build.sh
    args: [el10, x86_64]
    artifacts: "out/rpm/el10/x86_64/*.rpm"
  - name: Ubuntu 24.04
    image: docker.io/library/ubuntu:24.04
    arch: x86_64
    format: deb
    script: ./ci/build.sh
    args: [ubuntu2404, x86_64]
    artifacts: "out/deb/ubuntu2404/amd64/*.deb"

cache:
  enabled: true
  base_dir: /var/lib/jenkins-agent/.cache/opencattus
  mounts:
    - host_subdir: "conan/{name}"
      container_path: /root/.conan2
    - host_subdir: "cpm/{name}"
      container_path: /root/.cache/CPM
    - host_subdir: "sources/{name}"
      container_path: /root/.cache/opencattus/sources

change_policy:
  docs_only_paths:
    - "docs/**"
    - "**/*.md"
    - "**/*.rst"
  source_paths:
    - "src/**"
    - "include/**"
    - "test/**"
    - "fuzz_test/**"
    - "cmake/**"
    - ".versatushpc/**"
    - "**/*.cpp"
    - "**/*.hpp"
    - "**/*.h"
    - "CMakeLists.txt"
    - "CMakePresets.json"
    - "conanfile.py"
  packaging_paths:
    - "rpmspecs/**"
    - "scripts/**"
    - "**/*.spec"
